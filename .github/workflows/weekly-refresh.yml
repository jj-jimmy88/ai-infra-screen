name: Weekly data refresh
on:
  schedule:
    - cron: '30 5 * * 1'   # Every Monday 05:30 UTC (09:30 UAE) before US market open
  workflow_dispatch: {}     # ...and a manual "Run workflow" button
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install yfinance pandas numpy
      - run: python update_data.py
      - name: Commit updated data
        run: |
          git config user.name  "screen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Weekly data refresh $(date -u +%F)"
          git push
